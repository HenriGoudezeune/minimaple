<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#f5f5f7" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#000000" media="(prefers-color-scheme: dark)">
<title>mini-Maple</title>
<link rel="icon" href="/static/favicon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="/static/icon-180.png">
<link rel="stylesheet" href="/static/fonts.css">
<script src="/static/theme.js"></script>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/KaTeX/0.16.11/katex.min.css" integrity="sha384-nB0miv6/jRmo5UMMR1wu3Gz6NLsoTkbqJghGIsx//Rlm+ZU03BU6SQNC66uf4l5+" crossorigin="anonymous">
<link rel="stylesheet" href="/static/app.css">
</head>
<body>
<nav class="sh-nav">
  <span class="brand">mini-Maple<span>HydrarGyrum</span></span>
  <button class="themesw" type="button" role="switch" aria-checked="false" aria-label="HyGra-thema"><span>HyGra</span><span class="track"><span class="knob"></span></span></button>
</nav>
<main>
  <header class="pagehead">
    <div class="eyebrow">mini-Maple &middot; computeralgebra</div>
    <h1>mini-Maple</h1>
    <p class="lead">Maple-syntax, SymPy eronder. Ctrl+Enter om uit te voeren.</p>
  </header>

  <section class="card input-card">
    <textarea id="code" spellcheck="false" autocapitalize="off" autocomplete="off" autocorrect="off" rows="5" placeholder="int(x^2*sin(x), x);" aria-label="Invoer"></textarea>
    <div class="row">
      <button id="run" class="btn primary" type="button">Uitvoeren <kbd>Ctrl+Enter</kbd></button>
      <button id="reset" class="btn" type="button">Reset sessie</button>
      <button id="clear" class="btn ghost" type="button">Wis uitvoer</button>
    </div>
  </section>

  <div class="group">Uitvoer</div>
  <section id="out" class="stack" aria-live="polite"><p class="empty">Nog niets uitgevoerd.</p></section>

  <div class="group">Voorbeelden</div>
  <section id="examples" class="grid"></section>

  <div class="group">Geschiedenis <button id="clearhist" class="btn ghost small" type="button">Wissen</button></div>
  <section id="hist" class="stack"><p class="empty">Leeg.</p></section>
</main>
<script src="https://cdnjs.cloudflare.com/ajax/libs/KaTeX/0.16.11/katex.min.js" integrity="sha384-7zkQWkzuo3B5mTepMUcHkMB5jZaolc2xDwL6VFqjFALcbeS9Ggm/Yr2r3Dy4lfFg" crossorigin="anonymous" defer></script>
<script src="/static/app.js" defer></script>
</body>
</html>
