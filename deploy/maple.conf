# maple.hydrargyrum.be -> 127.0.0.1:8750. OPENBAAR; limieten zitten in de app.
server {
    listen 80;
    listen [::]:80;
    server_name maple.hydrargyrum.be;
    location /.well-known/acme-challenge/ { root /var/www/html; }
    location / { return 301 https://$host$request_uri; }
}
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name maple.hydrargyrum.be;
    ssl_certificate     /etc/letsencrypt/live/maple.hydrargyrum.be/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/maple.hydrargyrum.be/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;
    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Robots-Tag "noindex, nofollow" always;
    add_header Referrer-Policy "no-referrer" always;
    access_log /var/log/nginx/maple.access.log;
    error_log  /var/log/nginx/maple.error.log warn;
    client_max_body_size 1m;
    if ($request_method !~ ^(GET|HEAD|POST)$) { return 405; }
    location / {
        proxy_pass http://127.0.0.1:8750;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 70s;
        proxy_set_header Connection "";
    }
}
